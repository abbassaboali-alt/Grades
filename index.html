    <!-- Approved HTTPS hosts and save-shortcut deterrent -->
    <script>
      (function () {
        "use strict";
        const LOGIN_URL = "https://www.prudle-education.com/log-in-out";
        const ALLOWED_HOSTS = new Set([
          "www.prudle-education.com",
          "prudle-education.com",
          "abbassaboali-alt.github.io"
        ]);
        window.addEventListener("keydown", function (event) {
          if ((event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === "s") {
            event.preventDefault();
          }
        }, { capture: true });

        const isDev = location.hostname === "localhost" ||
          location.hostname === "127.0.0.1" ||
          location.hostname.endsWith(".run.app") ||
          location.hostname.includes("aistudio");

        const approved = isDev || (location.protocol === "https:" &&
          ALLOWED_HOSTS.has(location.hostname.toLowerCase()));

        if (!approved) {
          window.stop();
          try { document.documentElement.innerHTML = ""; } catch (error) {}
          window.location.replace(LOGIN_URL);
          return;
        }

        if (!isDev && location.hostname.toLowerCase() === "prudle-education.com") {
          window.location.replace("https://www.prudle-education.com" +
            location.pathname + location.search + location.hash);
        }
      })();
    </script>
